[tool.poetry]
name = "poposya-bot"
version = "0.1.0"
description = "Discord-бот Попося: модульная гексагональная архитектура, музыкальный модуль"
authors = ["wildheare"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
"discord.py" = { version = "^2.4", extras = ["voice"] }
yt-dlp = ">=2024.10.0"
pydantic-settings = "^2.4"
sqlalchemy = "^2.0"
aiosqlite = ">=0.20"
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# длину строк держит `ruff format`; длинные комментарии/строки не караем линтом
ignore = ["E501"]

[tool.mypy]
# строгая типизация только для ядра (domain + application); инфраструктуру
# импортируем «молча», чтобы её ошибки не валили гейт ядра
files = ["src/domain", "src/application"]
follow_imports = "silent"
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
