[tool.poetry]
name = "poposya-bot"
version = "0.1.0"
description = "Discord-бот Попося: модульная гексагональная архитектура, музыкальный модуль"
authors = ["wildheare"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
"discord.py" = { version = "^2.4", extras = ["voice"] }
yt-dlp = ">=2024.10.0"
pydantic-settings = "^2.4"
sqlalchemy = "^2.0"
aiosqlite = ">=0.20"
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# длину строк держит `ruff format`; длинные комментарии/строки не караем линтом
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# в тестах короткие lambda как фейки-колбэки читаются лучше, чем def
"tests/**" = ["E731"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Security/Query в дефолтах аргументов — идиома FastAPI, не баг (B008)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.mypy]
# строгая типизация ядра (domain + application) и репозиториев БД — границы,
# где типы ловят реальные баги (None на стыке ORM↔домен); остальную
# инфраструктуру импортируем «молча», чтобы её ошибки не валили гейт
files = ["src/domain", "src/application", "src/infrastructure/db/repositories"]
follow_imports = "silent"
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
