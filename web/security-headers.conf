# Заголовки безопасности панели (P0 чек-листа публичного запуска).
#
# Подключается через `include` в КАЖДЫЙ location: в nginx add_header из внешнего
# блока НЕ наследуется, если во вложенном есть свой add_header — поэтому держим
# их в одном файле и включаем везде. `always` = слать и на ответах-ошибках
# (4xx/5xx), а не только на 2xx/3xx.

# Кликджекинг: админку нельзя встраивать в чужой <iframe>. frame-ancestors в CSP
# ниже дублирует это для новых браузеров; X-Frame-Options — для старых.
add_header X-Frame-Options "DENY" always;

# Не угадывать MIME по содержимому (защита от подмены типа ответа).
add_header X-Content-Type-Options "nosniff" always;

# Referrer наружу — только origin и только на равном/более безопасном протоколе.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Отключаем мощные браузерные API, которые панели не нужны.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS: браузер игнорирует его поверх http, поэтому директива безопасна ещё до
# включения TLS. Как только запрос придёт по https (терминация здесь или на
# прокси впереди, см. web/TLS.md) — вступит в силу. includeSubDomains/preload
# намеренно НЕ ставим на старте, чтобы случайно не забанить http-поддомены.
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP. Панель — SPA с одного origin; API проксируется тем же nginx.
#  script-src 'self'        — Vite-сборка отдаёт внешние module-скрипты, инлайна
#                             и eval в бандле нет (проверено по исходникам).
#  style-src  'unsafe-inline' + fonts.googleapis.com — стили Google Fonts (link в
#                             index.html) и точечные inline-стили React.
#  font-src   fonts.gstatic.com — файлы шрифтов Google Fonts.
#  img-src    https:        — панель показывает произвольные картинки: аватары
#                             Discord (cdn.discordapp.com), превью аватара/баннера
#                             бота по URL (BotProfileCard), обложки треков из
#                             музыкальных CDN (NowPlaying). data: — для загруженных
#                             в панели картинок и инициалов-заглушек.
#  connect-src 'self'       — фронт ходит только в свой /api (в прод — тот же origin).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
