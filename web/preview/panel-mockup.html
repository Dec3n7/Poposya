<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Попося · панель (мокап)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- настоящие стили панели (в синхроне с приложением) -->
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      /* фон-фото в реальном билде грузится по абсолютному /webpoposya.png;
         в мокапе, открытом как файл, берём относительный путь до public */
      body {
        background:
          radial-gradient(125% 100% at 55% 40%, transparent 48%, rgba(0, 0, 0, 0.66)),
          linear-gradient(rgba(6, 7, 13, 0.32), rgba(6, 7, 13, 0.58)),
          url("../public/webpoposya.png") center / cover no-repeat,
          var(--bg);
        background-attachment: fixed;
      }
      /* мокап-плашка, чтобы не путать со «живой» панелью */
      .mock-ribbon {
        position: fixed;
        z-index: 50;
        right: 10px;
        bottom: 10px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(100deg, var(--accent), var(--magenta));
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
        pointer-events: none;
      }
      /* кнопки в мокапе некликабельны (визуал сохраняем, поведение — нет) */
      button {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- ==================== САЙДБАР ==================== -->
      <aside class="rail">
        <div class="rail-brand">
          <span class="rail-mark">🖤</span>
          <div>
            <div class="rail-name">Попося</div>
            <div class="rail-sub">панель сервера</div>
          </div>
        </div>

        <div class="rail-label">Меню</div>
        <nav class="rail-nav">
          <button class="rail-item active">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
            Обзор
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" /><path d="M3.5 19c.6-3 2.9-4.5 5.5-4.5s4.9 1.5 5.5 4.5" /><path d="M16 5.5a3 3 0 0 1 0 5.4M17.5 14.4c2 .6 3.4 2 3.8 4.1" /></svg>
            Люди
            <span class="rail-badge">3</span>
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" /><path d="M3 9h18M8 4v16M16 4v16" /></svg>
            Киноклуб
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" /><circle cx="6" cy="18" r="2.6" /><circle cx="16" cy="16" r="2.6" /></svg>
            Музыка
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z" /></svg>
            Находки
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z" /></svg>
            Модерация
            <span class="rail-badge alert">2</span>
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z" /><path d="M8 9h8M8 13h8M8 17h5" /></svg>
            Журнал
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5" /><rect x="13" y="3" width="8" height="8" rx="1.5" /><rect x="3" y="13" width="8" height="8" rx="1.5" /><path d="M17 14v6M14 17h6" /></svg>
            Модули
          </button>
          <button class="rail-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h7M15 17h5" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="12" r="2" /><circle cx="13" cy="17" r="2" /></svg>
            Настройки
          </button>
        </nav>

        <div class="rail-user">
          <span class="rail-avatar fallback">W</span>
          <span class="rail-username">wildheare</span>
          <div class="rail-user-actions">
            <button class="btn ghost small">← Серверы</button>
            <button class="btn ghost small">Выйти</button>
          </div>
        </div>
      </aside>

      <!-- ==================== СЦЕНА ==================== -->
      <main class="stage">
        <div class="stage-top">
          <button class="guild-chip" title="Сменить сервер">
            <span class="guild-chip-ic fallback">✂️</span>
            <span class="guild-chip-name">Поповская гостиная</span>
            <svg class="guild-chip-swap" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h13M17 20l4-4-4-4M21 16H8" /></svg>
          </button>
        </div>

        <div class="stage-body">
          <div class="stage-head">
            <div class="eyebrow">Обзор</div>
            <h1 class="stage-title">Поповская гостиная</h1>
          </div>

          <!-- период трендов -->
          <div class="dash-head">
            <span class="faint small">Тренды за</span>
            <div class="seg" role="group" aria-label="Период трендов">
              <button class="seg-item">7 дн</button>
              <button class="seg-item active">30 дн</button>
              <button class="seg-item">90 дн</button>
            </div>
          </div>

          <!-- карточки-метрики -->
          <div class="stat-row" id="statRow"></div>

          <!-- лидерборд + пончик ролей -->
          <div class="board">
            <div class="board-main">
              <div class="seg" role="tablist" aria-label="Лидерборды">
                <button class="seg-item active" role="tab">Очки</button>
                <button class="seg-item" role="tab">Войс</button>
                <button class="seg-item" role="tab">Дни рождения</button>
              </div>
              <div class="card leader-card" id="leaderCard"></div>
            </div>

            <div class="board-side">
              <h2 class="section-title">Роли сервера</h2>
              <div class="card pad" id="donutCard"></div>
            </div>
          </div>

          <!-- прирост участников -->
          <h2 class="section-title">Прирост участников</h2>
          <div class="card pad">
            <div id="minibars"></div>
            <div class="faint small" style="margin-top: 8px">
              Изменение числа участников по дням за выбранный период
            </div>
          </div>

          <!-- хитмап активности -->
          <h2 class="section-title">Активность по часам</h2>
          <div class="card pad">
            <div id="heatmap"></div>
          </div>
        </div>
      </main>
    </div>

    <div class="mock-ribbon">МОКАП · демо-данные</div>

    <script>
      // ------- палитра ролей (из web/src/roles.ts) -------
      const ROLE_COLORS = ["#8b93a7","#6ab0d8","#57c4b6","#9b8cf0","#f0899f","#e6b24d","#ff8a5c","#b57be0"];
      const roleColor = (i) => (i == null ? "var(--fg-faint)" : ROLE_COLORS[Math.min(Math.max(i, 0), 7)]);

      // ------- спарклайн (из Sparkline.tsx) -------
      function sparkline(values, width = 120, height = 34) {
        if (values.length < 2) return "";
        const min = Math.min(...values), max = Math.max(...values);
        const span = max - min || 1, pad = 2, w = width - pad * 2, h = height - pad * 2;
        const xy = values.map((v, i) => [pad + (i / (values.length - 1)) * w, pad + h - ((v - min) / span) * h]);
        const line = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
        const area = `${line} L${xy[xy.length - 1][0].toFixed(1)} ${(height - pad).toFixed(1)} L${xy[0][0].toFixed(1)} ${(height - pad).toFixed(1)} Z`;
        const gid = `sp-${min}-${max}-${values.length}`;
        return `<svg class="sparkline" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent-hover)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--accent-hover)" stop-opacity="0"/></linearGradient></defs>
          <path d="${area}" fill="url(#${gid})"/>
          <path d="${line}" fill="none" stroke="var(--accent-hover)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }

      // ------- знаковые бары (из MiniBars.tsx) -------
      function minibars(series, width = 280, height = 64) {
        if (!series.length) return "";
        const max = Math.max(1, ...series.map((v) => Math.abs(v)));
        const n = series.length, slots = Math.max(n, 30);
        const gap = slots > 60 ? 1 : 2, bw = Math.max(1.5, (width - gap * (slots - 1)) / slots);
        const x0 = width - (n * bw + (n - 1) * gap), mid = height / 2;
        let bars = "";
        series.forEach((v, i) => {
          const x = x0 + i * (bw + gap), hh = (Math.abs(v) / max) * (mid - 2);
          const y = v >= 0 ? mid - hh : mid;
          bars += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(v === 0 ? 0 : 1.5, hh).toFixed(2)}" rx="1" fill="${v >= 0 ? "var(--success)" : "var(--danger)"}"/>`;
        });
        return `<svg class="minibars" width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
          <line x1="0" y1="${mid}" x2="${width}" y2="${mid}" stroke="var(--border-soft)" stroke-width="1"/>${bars}</svg>`;
      }

      // ------- пончик ролей (из RoleDonut.tsx) -------
      function donut(slices) {
        const CX = 60, CY = 60, R = 52, RI = 34;
        const total = slices.reduce((s, x) => s + x.count, 0);
        if (!total) return "";
        const polar = (a, r) => [CX + r * Math.cos(a), CY + r * Math.sin(a)];
        let acc = 0, arcs = "";
        for (const s of slices) {
          const frac = s.count / total;
          const a0 = acc * 2 * Math.PI - Math.PI / 2; acc += frac;
          const a1 = acc * 2 * Math.PI - Math.PI / 2;
          const large = frac > 0.5 ? 1 : 0;
          const [xo0, yo0] = polar(a0, R), [xo1, yo1] = polar(a1, R);
          const [xi1, yi1] = polar(a1, RI), [xi0, yi0] = polar(a0, RI);
          const c = roleColor(s.index);
          if (frac >= 0.999) arcs += `<circle cx="${CX}" cy="${CY}" r="${(R + RI) / 2}" fill="none" stroke="${c}" stroke-width="${R - RI}"/>`;
          else arcs += `<path d="M${xo0.toFixed(2)} ${yo0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${xo1.toFixed(2)} ${yo1.toFixed(2)} L${xi1.toFixed(2)} ${yi1.toFixed(2)} A${RI} ${RI} 0 ${large} 0 ${xi0.toFixed(2)} ${yi0.toFixed(2)} Z" fill="${c}"/>`;
        }
        const legend = slices.map((s) => `<li><span class="role-dot" style="--role:${roleColor(s.index)}"></span><span class="donut-name">${s.name}</span><span class="donut-count mono">${s.count}</span></li>`).join("");
        return `<div class="donut-wrap"><svg width="120" height="120" viewBox="0 0 120 120" class="donut" aria-hidden="true">${arcs}
          <text x="${CX}" y="${CY - 1}" class="donut-total">${total}</text>
          <text x="${CX}" y="${CY + 15}" class="donut-sub">с ролью</text></svg>
          <ul class="donut-legend">${legend}</ul></div>`;
      }

      // ------- хитмап (из Heatmap.tsx) -------
      function heatmap(grid) {
        const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"], TICKS = [0, 6, 12, 18];
        const max = Math.max(0, ...grid.flat());
        if (!max) return "";
        let cells = `<span class="heatmap-corner"></span>`;
        for (let h = 0; h < 24; h++) cells += `<span class="heatmap-hour">${TICKS.includes(h) ? h : ""}</span>`;
        grid.forEach((row, d) => {
          cells += `<div class="heatmap-row" role="row"><span class="heatmap-dow">${DOW[d]}</span>`;
          row.forEach((count, h) => {
            const it = count === 0 ? 0 : 0.12 + 0.88 * Math.sqrt(count / max);
            cells += `<span class="heatmap-cell${count > 0 ? " on" : ""}" style="--i:${it.toFixed(3)}" title="${DOW[d]} ${String(h).padStart(2, "0")}:00 — ${count} сообщ."></span>`;
          });
          cells += `</div>`;
        });
        return `<div class="heatmap"><div class="heatmap-grid">${cells}</div>
          <div class="faint small heatmap-note">Сообщения по дню недели и часу · время UTC</div></div>`;
      }

      // ------- демо-данные -------
      const rng = (seed) => () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
      const r = rng(42);

      // серии для спарклайнов (30 точек, лёгкий тренд вверх + шум)
      const trend = (base, step, noise) => Array.from({ length: 30 }, (_, i) => Math.round(base + step * i + (r() - 0.5) * noise));
      const members = trend(120, 0.9, 4);
      const points = trend(8400, 55, 260);
      const voice = trend(210, 2.1, 14);
      const messages = trend(140, 1.4, 90).map((v) => Math.max(0, v));

      // карточки-метрики: значение + серия для спарклайна + дельта за период
      const delta = (s) => s[s.length - 1] - s[0];
      const cards = [
        { label: "В вотчлисте", value: 14, series: [11, 12, 12, 13, 14, 14] },
        { label: "Просмотрено", value: 63, series: [55, 57, 59, 60, 62, 63] },
        { label: "Плейлистов", value: 9, series: [7, 8, 8, 9, 9, 9] },
        { label: "Участников", value: members[members.length - 1], series: members },
        { label: "Всего очков", value: points[points.length - 1], series: points },
        { label: "Часов в войсе", value: voice[voice.length - 1], series: voice },
        { label: "Сообщений/день", value: messages[messages.length - 1], series: messages },
      ];
      document.getElementById("statRow").innerHTML = cards.map((c) => {
        const d = delta(c.series);
        const dh = d !== 0 ? `<span class="stat-delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d)}</span>` : "";
        return `<div class="stat-card tilt"><div class="stat-head"><div class="stat-value mono">${c.value}</div>${dh}</div>
          <div class="stat-label">${c.label}</div>${sparkline(c.series)}</div>`;
      }).join("");

      // лидерборд топ-очков
      const chip = (name, idx) => `<span class="person-meta"><span class="role-chip" style="--role:${roleColor(idx)}"><span class="role-dot"></span>${name}</span></span>`;
      const leaders = [
        { name: "Мари", role: "Особенная 🖤", idx: 5, pts: 1310, excl: true },
        { name: "Кай", role: "Близкий друг", idx: 4, pts: 1080 },
        { name: "Лу", role: "Друг", idx: 3, pts: 720 },
        { name: "Ннока", role: "Знакомый", idx: 2, pts: 460 },
        { name: "Тень", role: "Собеседник", idx: 1, pts: 285 },
        { name: "Пиксель", role: "Прохожий", idx: 0, pts: 140 },
      ];
      document.getElementById("leaderCard").innerHTML = leaders.map((e, i) => `
        <div class="leader-row${e.excl ? " exclusive" : ""}">
          <span class="leader-rank mono">${i + 1}</span>
          <span class="leader-avatar fallback">${e.name.slice(0, 1)}</span>
          <span class="leader-name"><span>${e.name}</span>${chip(e.role, e.idx)}</span>
          ${e.excl ? '<span class="badge">🖤 Единственный</span>' : ""}
          <span class="leader-points mono">${e.pts}</span>
        </div>`).join("");

      // пончик распределения ролей
      document.getElementById("donutCard").innerHTML = donut([
        { index: 0, name: "Прохожий", count: 48 },
        { index: 1, name: "Собеседник", count: 22 },
        { index: 2, name: "Знакомый", count: 15 },
        { index: 3, name: "Друг", count: 9 },
        { index: 4, name: "Близкий друг", count: 4 },
        { index: 5, name: "Особенная", count: 1 },
      ]);

      // прирост участников/день = разности серии members
      const deltas = members.slice(1).map((v, i) => v - members[i]);
      document.getElementById("minibars").innerHTML = minibars(deltas);

      // хитмап 7×24: вечерние пики, выходные активнее
      const grid = Array.from({ length: 7 }, (_, d) =>
        Array.from({ length: 24 }, (_, h) => {
          const evening = Math.exp(-((h - 21) ** 2) / 18) + 0.35 * Math.exp(-((h - 13) ** 2) / 20);
          const weekend = d >= 5 ? 1.5 : 1;
          const night = h < 7 ? 0.15 : 1;
          return Math.round(evening * weekend * night * (40 + r() * 30));
        }),
      );
      document.getElementById("heatmap").innerHTML = heatmap(grid);
    </script>
  </body>
</html>
