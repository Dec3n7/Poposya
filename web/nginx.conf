# Прод: nginx раздаёт статику панели и проксирует /api на бэкенд (тот же origin
# -> ни CORS, ни отдельного VITE_API_URL). SPA-фолбэк на index.html.
#
# Заголовки безопасности вынесены в security-headers.conf и включаются в каждый
# location (см. пояснение о наследовании add_header там же).

# --- rate limiting (http-контекст: conf.d включается внутри http{}) ----------
# Ключ — IP клиента. За обратным прокси, который терминирует TLS впереди nginx,
# $binary_remote_addr станет IP этого прокси (лимит будет общим на всех!) —
# тогда раскомментируйте real_ip ниже, чтобы брать настоящий IP из X-Forwarded-For.
# api   — общий поток панели (дашборд поллит плеер ~раз в 3с + разовые списки).
# login — старт OAuth: строже, против абьюза редиректов/перебора.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- за TLS-терминирующим прокси раскомментируйте и сузьте до его сети ---
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    include /etc/nginx/security-headers.conf;

    # OAuth-логин — строгий лимит (антиабьюз/антиперебор).
    location = /api/auth/login {
        include /etc/nginx/security-headers.conf;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вайтовые ассеты с хэшем в имени: при изменении меняется имя файла
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (и прочая нехэшированная статика): браузер всегда ревалидирует
    # по ETag (дешёвый 304) — иначе после деплоя грузится старый бандл
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
# Локальный TLS (самоподписанный серт на localhost, см. web/TLS.md, вариант «для
# себя»). Сертификаты монтируются в /etc/nginx/certs; порт 443 опубликован в
# docker-compose как 8443. Блок :80 выше НЕ трогаем — он не публикуется наружу и
# нужен только внутреннему healthcheck контейнера.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/security-headers.conf;

    location = /api/auth/login {
        include /etc/nginx/security-headers.conf;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
