# Прод: nginx раздаёт статику панели и проксирует /api на бэкенд (тот же origin
# -> ни CORS, ни отдельного VITE_API_URL). SPA-фолбэк на index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вайтовые ассеты с хэшем в имени: при изменении меняется имя файла
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (и прочая нехэшированная статика): браузер всегда ревалидирует
    # по ETag (дешёвый 304) — иначе после деплоя грузится старый бандл
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
