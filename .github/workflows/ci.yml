name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      # кавычки обязательны: двоеточие с пробелом внутри незакавыченной строки
      # YAML читает как начало нового ключа — файл переставал парситься целиком
      - name: "Mypy (ядро: domain + application)"
        run: mypy

      - name: Tests (SQLite)
        run: pytest -q

  # Бот живёт на PostgreSQL, а SQLite прощает то, чего Postgres не простит:
  # наивные даты, boolean-дефолты, конкурентные записи. Без этой работы
  # регрессия совместимости прошла бы мимо зелёного CI и всплыла в проде.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # без health-cmd шаги стартуют раньше, чем БД начнёт отвечать
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # pg_dump — чтобы интеграционные тесты бэкапа не пропускались, а работали
      - name: Install postgresql-client (pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations apply to a clean PostgreSQL
        env:
          DISCORD_TOKEN: ci
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
        run: alembic upgrade head

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
        run: pytest -q

  # Фронт панели: раньше гейтом была только локальная docker-сборка. Здесь тот же
  # tsc + vite build, что и в web/Dockerfile (npm install, не ci — package-lock не
  # обязан быть в синхроне), плюс юнит-тесты vitest на чистые утилиты.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build (tsc typecheck + vite build)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test
