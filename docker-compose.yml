# Стек Попоси: bot + db (Postgres) + api (uvicorn) + web (nginx).
# Единственный источник настроек — файл .env рядом с этим файлом.
#
# Запуск (поднимает весь стек сразу):
#   docker compose up -d --build
#
# БД в Docker — ВСЕГДА PostgreSQL (сервис db). В .env обязательны две строки:
#   POSTGRES_PASSWORD=ПАРОЛЬ
#   BOT_DATABASE_URL=postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya
# Без них compose падает на разборе файла (:?). Это сознательно: раньше
# отсутствие переменной тихо уводило бота на пустой SQLite и однажды стоило
# данных. SQLite остаётся ТОЛЬКО для локального запуска без Docker и тестов.
#
# Данные из старого SQLite сами НЕ переедут — первый старт на Postgres даёт
# пустую базу (перенос — отдельная задача: pgloader или ручной дамп).
# Автобэкап на Postgres работает (pg_dump -Fc в volume bot_data).
#
# Cookies YouTube (если нужны): положите файл в ./secrets и укажите путь в .env
# (YTDLP_COOKIES_FILE=/app/secrets/youtube-cookies.txt).

services:
  bot:
    build: .
    # Общий образ с api (A5, docs/plans/scale-300-guilds.md): bot и api строят
    # ОДИН и тот же Dockerfile и различаются лишь командой запуска (api — uvicorn).
    # Единый тег `image:` заставляет BuildKit собрать образ один раз и обоих на
    # него сослаться — вместо двух одинаковых образов по 1.3 ГБ на диске.
    image: poposyap-app:latest
    restart: unless-stopped
    # Изоляция: процесс уже под непривилегированным пользователем (Dockerfile),
    # снимаем и все Linux-capabilities (нашему коду они не нужны) и запрещаем
    # повышение прав через setuid-бинарники. Побег ограничен максимально.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ФС образа только на чтение: побег/RCE не сможет дописать в бинарь или код.
    # Всё писчее у бота уходит на volume /app/data (SQLite/логи/аудиокэш) — он
    # монтируется поверх ro-rootfs и остаётся писабельным. /tmp — эфемерный tmpfs
    # для сюрпризных записей библиотек; XDG_CACHE_HOME=/tmp уводит туда же кэш
    # yt-dlp (иначе он бился бы о read-only /app/.cache). .pyc не пишем
    # (PYTHONDONTWRITEBYTECODE в Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    # Без лимита утечка в боте съедает весь хост — вместе со сторожем (WARDEN),
    # и авария остаётся никем не замеченной. С лимитом отказ локален и точно
    # назван: Docker выставляет OOMKilled, мониторинг читает его напрямую.
    # 512M — пятикратный запас к рабочим ~100 МБ: субпроцессы ffmpeg/yt-dlp при
    # музыке считаются в тот же cgroup.
    mem_limit: 512m
    env_file: .env
    environment:
      # кэш библиотек (в т.ч. yt-dlp) — в tmpfs /tmp, а не в read-only HOME=/app
      XDG_CACHE_HOME: /tmp
      # Внутри контейнера БД — всегда Postgres (сервис db). BOT_DATABASE_URL
      # обязателен: без него compose падает на разборе файла (:?), а не уводит
      # бота на тихий пустой SQLite. Отдельное имя (не DATABASE_URL) — чтобы
      # значение DATABASE_URL из .env, рассчитанное на запуск без Docker, не
      # перебило адрес контейнерной базы. Логи — на volume, переживают пересборку.
      DATABASE_URL: ${BOT_DATABASE_URL:?задайте BOT_DATABASE_URL (postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya) в .env}
      LOG_FILE: /app/data/logs/bot.log
    # default — общая сеть (db/api/WARDEN); render — приватная до renderer
    networks:
      - default
      - render
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_started
    ports:
      # Только loopback: на 8080 висит /health/full с внутренними метриками
      # (коги/задачи/outbox/ошибки/листенеры) — наружу его публиковать нельзя.
      # WARDEN читает бот по docker-сети (bot:8080), ему эта публикация не нужна;
      # порт остаётся лишь для ручной проверки с самого хоста.
      - "127.0.0.1:8080:8080"   # /health и /ready (в браузере на хосте: http://localhost:8080/health)
    healthcheck:
      # urlopen кидает исключение на HTTP 503 -> ненулевой код выхода -> unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # время на миграции и подключение к Discord
    volumes:
      - bot_data:/app/data
      # секреты для yt-dlp: положи ./secrets/youtube-cookies.txt (Netscape-формат)
      # и укажи YTDLP_COOKIES_FILE=/app/secrets/youtube-cookies.txt в .env.
      # Каталог монтируется всегда (не ломается, если файла ещё нет).
      - ./secrets:/app/secrets:ro

  # Веб-панель (REST API) — отдельный процесс, та же Postgres и та же бизнес-логика.
  # Панели нужен общий с ботом Postgres (командный мост панель<->бот на LISTEN/NOTIFY;
  # SQLite — один писатель). Миграции применяет бот; api при гонке на старте
  # перезапустится. Порт наружу НЕ публикуется: снаружи всё через nginx (web).
  api:
    build: .
    # Тот же образ, что у bot (A5): один build на двоих. Команда запуска api
    # переопределяется ниже (uvicorn), поэтому общий образ различий не стирает.
    image: poposyap-app:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ФС только на чтение: api вообще не пишет на диск (логи в stdout, БД —
    # Postgres по сети). /tmp — эфемерный tmpfs на случай библиотечных записей.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    env_file: .env
    environment:
      # кэш библиотек — в tmpfs, а не в read-only HOME=/app
      XDG_CACHE_HOME: /tmp
      # та же БД, что у бота (см. BOT_DATABASE_URL в .env); обязательна (:?)
      DATABASE_URL: ${BOT_DATABASE_URL:?задайте BOT_DATABASE_URL (postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya) в .env}
      LOG_FILE: ""   # api логирует в stdout, файл не нужен
      # фронт и api — один origin через nginx (:8081); сюда же post-login redirect
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:8081}
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8081"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Веб-панель (фронт): nginx раздаёт собранную статику и проксирует /api на api.
  # Единственный публикуемый порт панели -> один origin, без CORS, кука работает.
  web:
    build: ./web
    restart: unless-stopped
    # Rootless: образ nginx-unprivileged работает под UID 101 (мастер И воркеры),
    # слушает высокие порты 8080/8443 -> НИ ОДНОЙ capability не нужно.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read-only rootfs: всё писчее nginx (pid, client/proxy temp) образ уже держит
    # под /tmp -> монтируем туда tmpfs. Скомпрометированный nginx не перезапишет
    # ни бинарь, ни конфиг, ни статику.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    depends_on:
      - api
    ports:
      # локальный HTTPS: панель на https://localhost:8443. Контейнерный порт тоже
      # 8443 (rootless nginx). :8080 (внутренний HTTP) наружу НЕ публикуем.
      - "8443:8443"
    volumes:
      # самоподписанный серт (web/certs/*.pem, в git не коммитится). Смена серта
      # без пересборки образа — просто подмени файлы и перезапусти web.
      # Файлы должны быть читаемы UID 101 (nginx) — приватный ключ не 0600 root-only.
      - ./web/certs:/etc/nginx/certs:ro
    healthcheck:
      # раздача статики жива? (busybox wget есть в образе). Не завязано на api —
      # панель отвечает index.html даже при недоступном бэкенде. 127.0.0.1, НЕ
      # localhost: localhost в alpine резолвится в ::1, а nginx слушает IPv4
      # 0.0.0.0:8080 -> по ::1 отказ и ложный unhealthy. Бьёмся во внутренний :8080.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Энтрипойнт postgres стартует под root, чинит права на data-каталог и
    # gosu-дропает в пользователя postgres — это понижение прав, no-new-privileges
    # его не ломает. cap_drop НЕ ставим: инициализации нужны setuid/chown.
    security_opt:
      - no-new-privileges:true
    # Намеренно щедро (×20 к рабочим ~105 МБ): здесь лимит — предохранитель от
    # разгона, а не рабочая граница. Причины две. Page cache считается в лимит
    # cgroup, а Postgres держит на нём производительность (shared_buffers всего
    # 128 МБ) — тесный лимит вытеснит кэш и замедлит базу. И OOM у Postgres не
    # мягкий: убитый backend уводит postmaster в crash recovery, то есть рвёт
    # все соединения и перезапускает кластер целиком.
    # Настоящую границу задаёт конфиг Postgres (command ниже), не этот лимит.
    # На малом VPS limit можно ужать до 768 МБ–1 ГБ (B2, docs/plans/scale-300-
    # guilds.md) — это осознанный выбор под конкретный бокс, а не дефолт: OOM у
    # Postgres рвёт кластер в crash recovery, поэтому меняем с замером, не на ходу.
    mem_limit: 2g
    # Явный конфиг Postgres (B2): раньше всё шло на дефолтах. shared_buffers 128→
    # 256 МБ (кэш горячих страниц), effective_cache_size — подсказка планировщику
    # о доступном page cache (память не резервирует). max_connections 100→50 под
    # ужатый пул приложения (5+10 на процесс × 2 = 30, см. session.py) с запасом
    # на psql/миграции. work_mem умеренно: 50 коннектов × сортировки не должны
    # пробить limit. Числа консервативны — на росте данных калибровать под бокс.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: poposya
      POSTGRES_USER: poposya
      # обязателен (:?): Postgres теперь единственный путь, так что забытый пароль
      # должен ломать compose сразу на разборе файла, а не глубже при старте db.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    healthcheck:
      # bot ждёт этой проверки: миграции на старте не переживут недоступную БД
      test: ["CMD-SHELL", "pg_isready -U poposya -d poposya"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Изолированный рендер карточек (HTML → PNG через Chromium). Вынесен из бота:
  # браузер под --no-sandbox — крупнейшая attack surface, и его компрометация не
  # должна давать доступ к Discord-токену, БД или сети. Сидит ТОЛЬКО в render-сети
  # (internal: true — без выхода в интернет), непривилегированный пользователь,
  # cap_drop ALL, no-new-privileges. Принимает самодостаточный HTML от бота и
  # отдаёт PNG. Наружу порт не публикуется.
  renderer:
    build: ./renderer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ФС контейнера только на чтение: браузер под --no-sandbox — крупнейшая attack
    # surface, read-only rootfs лишает эксплойт возможности что-либо дописать в
    # образ. Всё писчее — в эфемерный tmpfs /tmp (профиль Chromium, shared memory
    # через --disable-dev-shm-usage). Браузер лежит в /ms-playwright (тоже ro, ок).
    read_only: true
    tmpfs:
      - /tmp
    # Chromium прожорлив к памяти на старте страницы; 512M с запасом. OOM локален.
    mem_limit: 512m
    # Тюнинг рендера без пересборки образа (A2/A3, docs/plans/scale-300-guilds.md):
    # границы content-кэша PNG и кап одновременных рендеров. Дефолты — в коде
    # (server.py); .env лишь переопределяет. RENDER_CACHE_MAX_BYTES=0 гасит кэш.
    environment:
      RENDER_CACHE_MAX_ENTRIES: ${RENDER_CACHE_MAX_ENTRIES:-512}
      RENDER_CACHE_MAX_BYTES: ${RENDER_CACHE_MAX_BYTES:-268435456}
      RENDER_MAX_CONCURRENCY: ${RENDER_MAX_CONCURRENCY:-3}
      RENDER_QUEUE_TIMEOUT_SECONDS: ${RENDER_QUEUE_TIMEOUT_SECONDS:-10}
    networks:
      - render
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # обычная bridge-сеть проекта (poposyap_default) — её же снаружи подключает
  # WARDEN; имя не меняем, иначе сторож потеряет bot/api.
  default:
  # приватная сеть бот↔renderer: internal — без выхода в интернет. Даже если
  # браузер скомпрометируют, ему некуда ходить, и с хоста он недостижим.
  render:
    internal: true

volumes:
  bot_data:
  pg_data:
