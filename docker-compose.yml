# Минимальный профиль: только бот + volume для SQLite (ТЗ 13.2).
# Единственный источник настроек — файл .env рядом с этим файлом.
#
# Путь к БД и логам для контейнера переопределён ниже в environment —
# править .env для Docker не нужно, база живёт на volume bot_data.
#
# Cookies YouTube (если нужны): положите cookies.txt рядом, раскомментируйте
# volume ниже и укажите в .env: YTDLP_COOKIES_FILE=/app/data/cookies.txt
#
# ── Переход на PostgreSQL ────────────────────────────────────────────────
# Сервис db уже описан ниже, но спит под профилем postgres — пока он не нужен,
# контейнер не поднимается. Чтобы переехать, в .env:
#   BOT_DATABASE_URL=postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya
#   POSTGRES_PASSWORD=ПАРОЛЬ
# и запускать с профилем:
#   docker compose --profile postgres up -d --build
# Данные из SQLite при этом НЕ переедут сами — база будет пустой.
# ВНИМАНИЕ: встроенный автобэкап умеет только SQLite; на Postgres нужен
# pg_dump снаружи (бот честно предупредит об этом в логе старта).

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # переопределяют значения из .env только внутри контейнера:
      # база и логи — на volume, чтобы пережить пересборку образа.
      # BOT_DATABASE_URL (а не DATABASE_URL) — чтобы значение из .env,
      # рассчитанное на запуск без Docker, не подменило путь на volume
      DATABASE_URL: ${BOT_DATABASE_URL:-sqlite+aiosqlite:////app/data/poposya.db}
      LOG_FILE: /app/data/logs/bot.log
    depends_on:
      db:
        condition: service_healthy
        required: false   # без профиля postgres сервиса db нет — и это нормально
    ports:
      - "8080:8080"   # /health и /ready (проверка в браузере: http://localhost:8080/health)
    healthcheck:
      # urlopen кидает исключение на HTTP 503 -> ненулевой код выхода -> unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # время на миграции и подключение к Discord
    volumes:
      - bot_data:/app/data
      # - ./cookies.txt:/app/data/cookies.txt:ro

  # Веб-панель (REST API) — отдельный процесс, та же Postgres и та же бизнес-логика.
  # Живёт под профилем postgres: панель без общей БД смысла не имеет (SQLite —
  # один писатель). Миграции применяет бот; api при гонке на старте перезапустится.
  # Порт наружу НЕ публикуется: снаружи всё через nginx (web), api — внутренний.
  api:
    profiles: ["postgres"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # та же БД, что у бота (см. BOT_DATABASE_URL в .env)
      DATABASE_URL: ${BOT_DATABASE_URL:-sqlite+aiosqlite:////app/data/poposya.db}
      LOG_FILE: ""   # api логирует в stdout, файл не нужен
      # фронт и api — один origin через nginx (:8081); сюда же post-login redirect
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:8081}
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8081"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Веб-панель (фронт): nginx раздаёт собранную статику и проксирует /api на api.
  # Единственный публикуемый порт панели -> один origin, без CORS, кука работает.
  web:
    profiles: ["postgres"]
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  # Поднимается только с профилем: docker compose --profile postgres up -d
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poposya
      POSTGRES_USER: poposya
      # без :? — compose подставляет переменные при РАЗБОРЕ файла, не глядя на
      # профили, и обязательная переменная ломала бы обычный запуск на SQLite.
      # Забыли пароль -> контейнер db честно откажется стартовать.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      # bot ждёт этой проверки: миграции на старте не переживут недоступную БД
      test: ["CMD-SHELL", "pg_isready -U poposya -d poposya"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  bot_data:
  pg_data:
