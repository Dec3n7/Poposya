# Стек Попоси: bot + db (Postgres) + api (uvicorn) + web (nginx).
# Единственный источник настроек — файл .env рядом с этим файлом.
#
# Запуск (поднимает весь стек сразу):
#   docker compose up -d --build
#
# БД в Docker — ВСЕГДА PostgreSQL (сервис db). В .env обязательны две строки:
#   POSTGRES_PASSWORD=ПАРОЛЬ
#   BOT_DATABASE_URL=postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya
# Без них compose падает на разборе файла (:?). Это сознательно: раньше
# отсутствие переменной тихо уводило бота на пустой SQLite и однажды стоило
# данных. SQLite остаётся ТОЛЬКО для локального запуска без Docker и тестов.
#
# Данные из старого SQLite сами НЕ переедут — первый старт на Postgres даёт
# пустую базу (перенос — отдельная задача: pgloader или ручной дамп).
# Автобэкап на Postgres работает (pg_dump -Fc в volume bot_data).
#
# Cookies YouTube (если нужны): положите файл в ./secrets и укажите путь в .env
# (YTDLP_COOKIES_FILE=/app/secrets/youtube-cookies.txt).

services:
  bot:
    build: .
    restart: unless-stopped
    # Изоляция: процесс уже под непривилегированным пользователем (Dockerfile),
    # снимаем и все Linux-capabilities (нашему коду они не нужны) и запрещаем
    # повышение прав через setuid-бинарники. Побег ограничен максимально.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Без лимита утечка в боте съедает весь хост — вместе со сторожем (WARDEN),
    # и авария остаётся никем не замеченной. С лимитом отказ локален и точно
    # назван: Docker выставляет OOMKilled, мониторинг читает его напрямую.
    # 512M — пятикратный запас к рабочим ~100 МБ: субпроцессы ffmpeg/yt-dlp при
    # музыке считаются в тот же cgroup.
    mem_limit: 512m
    env_file: .env
    environment:
      # Внутри контейнера БД — всегда Postgres (сервис db). BOT_DATABASE_URL
      # обязателен: без него compose падает на разборе файла (:?), а не уводит
      # бота на тихий пустой SQLite. Отдельное имя (не DATABASE_URL) — чтобы
      # значение DATABASE_URL из .env, рассчитанное на запуск без Docker, не
      # перебило адрес контейнерной базы. Логи — на volume, переживают пересборку.
      DATABASE_URL: ${BOT_DATABASE_URL:?задайте BOT_DATABASE_URL (postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya) в .env}
      LOG_FILE: /app/data/logs/bot.log
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Только loopback: на 8080 висит /health/full с внутренними метриками
      # (коги/задачи/outbox/ошибки/листенеры) — наружу его публиковать нельзя.
      # WARDEN читает бот по docker-сети (bot:8080), ему эта публикация не нужна;
      # порт остаётся лишь для ручной проверки с самого хоста.
      - "127.0.0.1:8080:8080"   # /health и /ready (в браузере на хосте: http://localhost:8080/health)
    healthcheck:
      # urlopen кидает исключение на HTTP 503 -> ненулевой код выхода -> unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # время на миграции и подключение к Discord
    volumes:
      - bot_data:/app/data
      # секреты для yt-dlp: положи ./secrets/youtube-cookies.txt (Netscape-формат)
      # и укажи YTDLP_COOKIES_FILE=/app/secrets/youtube-cookies.txt в .env.
      # Каталог монтируется всегда (не ломается, если файла ещё нет).
      - ./secrets:/app/secrets:ro

  # Веб-панель (REST API) — отдельный процесс, та же Postgres и та же бизнес-логика.
  # Панели нужен общий с ботом Postgres (командный мост панель<->бот на LISTEN/NOTIFY;
  # SQLite — один писатель). Миграции применяет бот; api при гонке на старте
  # перезапустится. Порт наружу НЕ публикуется: снаружи всё через nginx (web).
  api:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    env_file: .env
    environment:
      # та же БД, что у бота (см. BOT_DATABASE_URL в .env); обязательна (:?)
      DATABASE_URL: ${BOT_DATABASE_URL:?задайте BOT_DATABASE_URL (postgresql+asyncpg://poposya:ПАРОЛЬ@db:5432/poposya) в .env}
      LOG_FILE: ""   # api логирует в stdout, файл не нужен
      # фронт и api — один origin через nginx (:8081); сюда же post-login redirect
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:8081}
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8081"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Веб-панель (фронт): nginx раздаёт собранную статику и проксирует /api на api.
  # Единственный публикуемый порт панели -> один origin, без CORS, кука работает.
  web:
    build: ./web
    restart: unless-stopped
    # nginx мастер стартует под root (штатно), воркеры — под nginx; снимаем хотя
    # бы повышение прав. Полный rootless — опция nginx-unprivileged (см. RUNBOOK).
    security_opt:
      - no-new-privileges:true
    # cap_drop ALL + вернуть только необходимое nginx-мастеру под root:
    # CHOWN (владелец cache/log), SETUID/SETGID (сброс воркеров в nginx),
    # NET_BIND_SERVICE (bind :80/:443), DAC_OVERRIDE (чтение файлов). Всё
    # остальное (raw sockets, mknod, ptrace, …) недоступно.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    mem_limit: 128m
    depends_on:
      - api
    ports:
      # локальный HTTPS: панель на https://localhost:8443. :80 больше не
      # публикуем — только https снаружи (внутри :80 остаётся для healthcheck).
      - "8443:443"
    volumes:
      # самоподписанный серт (web/certs/*.pem, в git не коммитится). Смена серта
      # без пересборки образа — просто подмени файлы и перезапусти web.
      - ./web/certs:/etc/nginx/certs:ro
    healthcheck:
      # раздача статики жива? (busybox wget есть в nginx:alpine). Не завязано на
      # api — панель отвечает index.html даже при недоступном бэкенде.
      # 127.0.0.1, НЕ localhost: localhost в alpine резолвится в ::1, а nginx
      # слушает только IPv4 0.0.0.0:80 -> по ::1 отказ и ложный unhealthy.
      # Бьёмся во внутренний :80 (не публикуется) — серт проверять не нужно.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Энтрипойнт postgres стартует под root, чинит права на data-каталог и
    # gosu-дропает в пользователя postgres — это понижение прав, no-new-privileges
    # его не ломает. cap_drop НЕ ставим: инициализации нужны setuid/chown.
    security_opt:
      - no-new-privileges:true
    # Намеренно щедро (×20 к рабочим ~105 МБ): здесь лимит — предохранитель от
    # разгона, а не рабочая граница. Причины две. Page cache считается в лимит
    # cgroup, а Postgres держит на нём производительность (shared_buffers всего
    # 128 МБ) — тесный лимит вытеснит кэш и замедлит базу. И OOM у Postgres не
    # мягкий: убитый backend уводит postmaster в crash recovery, то есть рвёт
    # все соединения и перезапускает кластер целиком.
    # Настоящую границу задаёт конфиг Postgres, не этот лимит.
    mem_limit: 2g
    environment:
      POSTGRES_DB: poposya
      POSTGRES_USER: poposya
      # обязателен (:?): Postgres теперь единственный путь, так что забытый пароль
      # должен ломать compose сразу на разборе файла, а не глубже при старте db.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    healthcheck:
      # bot ждёт этой проверки: миграции на старте не переживут недоступную БД
      test: ["CMD-SHELL", "pg_isready -U poposya -d poposya"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  bot_data:
  pg_data:
